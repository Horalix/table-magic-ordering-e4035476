<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7E9B79" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="La Soul" />
    <!-- iOS uses apple-touch-icon for the Home Screen icon (it ignores the web manifest icons) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- The CSS @import for Google Fonts cannot start its connection until the
         stylesheet has parsed, which on a phone on 3G is most of a second of
         invisible text. Preconnecting here overlaps that with the HTML parse. -->
    <!--
      Fonts are self-hosted and subset; see scripts/build-fonts.py. Preloaded
      because they are referenced from the CSS bundle, which the browser only
      parses after fetching it — without these two hints the faces are
      discovered a full round trip late and the first paint is unstyled.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lora.woff2" crossorigin />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="dns-prefetch" href="//wsrv.nl" />
    <link rel="dns-prefetch" href="//menu.lasoul.net" />
    <!--
      The website's hero photograph, requested while the app's code is still
      downloading — and only on `/`, so a guest scanning a table code is never
      sent it. The media queries and widths must match SiteHero.tsx and
      scripts/site-images.mjs, or the browser fetches the hero twice.
    -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        function preload(name, widths, media) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/webp';
          l.media = media;
          l.setAttribute('imagesrcset', widths.map(function (w) { return '/site/' + name + '-' + w + '.webp ' + w + 'w'; }).join(', '));
          l.setAttribute('imagesizes', '100vw');
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
        preload('hero-wide', [960, 1280, 1600, 2048], '(min-width: 640px)');
        preload('hero-tall', [480, 720, 960, 1152], '(max-width: 639.98px)');
      })();
    </script>
    <!-- Defaults for crawlers and link previews that do not run JavaScript;
         the website sets absolute URLs and structured data when it loads. -->
    <title>La Soul — Cake &amp; Burger Boutique in Sarajevo</title>
    <meta name="description" content="A fully halal, alcohol-free café in Sarajevo: burgers, cakes and coffee, made fresh. See the menu and order from your table." />
    <meta name="author" content="La Soul" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Soul" />
    <meta property="og:image" content="/site/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="La Soul — Cake &amp; Burger Boutique in Sarajevo" />
    <meta property="og:description" content="A fully halal, alcohol-free café in Sarajevo: burgers, cakes and coffee, made fresh. See the menu and order from your table." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/site/og.jpg" />
    <meta name="twitter:title" content="La Soul — Cake &amp; Burger Boutique in Sarajevo" />
    <meta name="twitter:description" content="A fully halal, alcohol-free café in Sarajevo: burgers, cakes and coffee, made fresh. See the menu and order from your table." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
